name: Build ByeDPI APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream native components, pinned for reproducible builds.
  BYEDPI_REPO: https://github.com/hufrea/byedpi.git
  BYEDPI_REF: v0.17.3
  HEV_REPO: https://github.com/heiher/hev-socks5-tunnel.git
  HEV_REF: "2.17.1"
  GRADLE_VERSION: "8.9"
  APK_PATH: app/build/outputs/apk/debug/app-debug.apk

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository layout
        shell: bash
        run: |
          set -uo pipefail
          missing=0
          while read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done <<'EOF'
          settings.gradle.kts
          build.gradle.kts
          gradle.properties
          app/build.gradle.kts
          app/src/main/AndroidManifest.xml
          app/src/main/res/values/strings.xml
          app/src/main/res/values/strings_runtime.xml
          app/src/main/res/values/colors.xml
          app/src/main/res/values/dimens.xml
          app/src/main/res/values/themes.xml
          app/src/main/res/values/styles.xml
          app/src/main/res/drawable/bg_card.xml
          app/src/main/res/drawable/bg_log.xml
          app/src/main/res/drawable/bg_status_dot.xml
          app/src/main/res/drawable/bg_icon_button.xml
          app/src/main/res/drawable/ic_logo.xml
          app/src/main/res/drawable/ic_notification.xml
          app/src/main/res/drawable/ic_settings.xml
          app/src/main/res/drawable/ic_diagnostics.xml
          app/src/main/res/drawable/ic_back.xml
          app/src/main/res/drawable/ic_launcher_background.xml
          app/src/main/res/drawable/ic_launcher_foreground.xml
          app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          app/src/main/res/layout/activity_main.xml
          app/src/main/res/layout/activity_settings.xml
          app/src/main/res/layout/activity_diagnostics.xml
          app/src/main/java/com/byedpi/app/ByeDpiApp.kt
          app/src/main/java/com/byedpi/app/data/AppSettings.kt
          app/src/main/java/com/byedpi/app/data/SettingsRepository.kt
          app/src/main/java/com/byedpi/app/core/DiagnosticsLog.kt
          app/src/main/java/com/byedpi/app/core/EngineStatus.kt
          app/src/main/java/com/byedpi/app/core/Formatters.kt
          app/src/main/java/com/byedpi/app/core/EngineInfo.kt
          app/src/main/java/com/byedpi/app/core/ProxyEngine.kt
          app/src/main/java/com/byedpi/app/core/ProxyProbe.kt
          app/src/main/java/com/byedpi/app/core/ConnectivityCheck.kt
          app/src/main/java/com/byedpi/app/core/TunnelConfig.kt
          app/src/main/java/com/byedpi/app/core/ByeDpiNative.kt
          app/src/main/java/com/byedpi/app/core/TProxyService.kt
          app/src/main/java/com/byedpi/app/service/ByeDpiVpnService.kt
          app/src/main/java/com/byedpi/app/ui/Insets.kt
          app/src/main/java/com/byedpi/app/ui/MainActivity.kt
          app/src/main/java/com/byedpi/app/ui/SettingsActivity.kt
          app/src/main/java/com/byedpi/app/ui/DiagnosticsActivity.kt
          app/src/main/jni/Android.mk
          app/src/main/jni/Application.mk
          app/src/main/jni/engine/Android.mk
          app/src/main/jni/engine/byedpi_jni.c
          EOF
          if [ "$missing" -ne 0 ]; then
            echo "::error::Some project files are missing or are at the wrong path. Fix the paths above and push again."
            exit 1
          fi
          echo "All required project files are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="$(sed -n 's/.*ndkVersion = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$NDK_VERSION" ]; then
            echo "::error::ndkVersion not found in app/build.gradle.kts"
            exit 1
          fi
          echo "Installing NDK ${NDK_VERSION}"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Verify pinned upstream tags exist
        shell: bash
        run: |
          set -euo pipefail
          check_ref() {
            local repo="$1" ref="$2"
            if git ls-remote --exit-code --tags "$repo" "refs/tags/${ref}" > /dev/null; then
              echo "OK: ${repo} @ ${ref}"
            else
              echo "::error::Tag '${ref}' was not found in ${repo}. Most recent tags:"
              git ls-remote --tags --refs --sort=-v:refname "$repo" | head -n 10 || true
              return 1
            fi
          }
          check_ref "$BYEDPI_REPO" "$BYEDPI_REF"
          check_ref "$HEV_REPO" "$HEV_REF"

      - name: Fetch upstream native sources
        shell: bash
        run: |
          set -euxo pipefail
          JNI_DIR=app/src/main/jni
          rm -rf "$JNI_DIR/byedpi" "$JNI_DIR/hev-socks5-tunnel"

          git clone --depth 1 --branch "$BYEDPI_REF" "$BYEDPI_REPO" "$JNI_DIR/byedpi"
          git clone --depth 1 --branch "$HEV_REF" --recurse-submodules --shallow-submodules \
            "$HEV_REPO" "$JNI_DIR/hev-socks5-tunnel"

          BYEDPI_SHA="$(git -C "$JNI_DIR/byedpi" rev-parse HEAD)"
          HEV_SHA="$(git -C "$JNI_DIR/hev-socks5-tunnel" rev-parse HEAD)"

          # Keep the tree clean: git metadata is not needed for the build.
          rm -rf "$JNI_DIR/byedpi/.git" "$JNI_DIR/hev-socks5-tunnel/.git"
          find "$JNI_DIR/hev-socks5-tunnel" -name .git -prune -exec rm -rf {} +

          # Ship upstream licenses and exact engine versions inside the APK.
          mkdir -p app/src/main/assets/licenses
          cp "$JNI_DIR/byedpi/LICENSE" app/src/main/assets/licenses/byedpi-LICENSE.txt
          cp "$JNI_DIR/hev-socks5-tunnel/LICENSE" app/src/main/assets/licenses/hev-socks5-tunnel-LICENSE.txt
          {
            echo "byedpi=${BYEDPI_REF} ${BYEDPI_SHA}"
            echo "hev-socks5-tunnel=${HEV_REF} ${HEV_SHA}"
          } > app/src/main/assets/upstream-versions.txt

          {
            echo "### Upstream native components"
            echo "- byedpi \`${BYEDPI_REF}\` (\`${BYEDPI_SHA}\`)"
            echo "- hev-socks5-tunnel \`${HEV_REF}\` (\`${HEV_SHA}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect upstream sources
        shell: bash
        run: |
          set -euo pipefail
          JNI_DIR=app/src/main/jni
          echo "ByeDPI C files:"
          ls "$JNI_DIR"/byedpi/*.c

          if [ ! -f "$JNI_DIR/byedpi/main.c" ]; then
            echo "::error::byedpi/main.c is missing"
            exit 1
          fi
          if [ ! -f "$JNI_DIR/hev-socks5-tunnel/Android.mk" ]; then
            echo "::error::hev-socks5-tunnel/Android.mk is missing (ndk-build cannot include it)"
            exit 1
          fi
          if ! grep -Eq '^int[[:space:]]+main[[:space:]]*\(' "$JNI_DIR/byedpi/main.c"; then
            echo "::warning::'int main(' not found at line start in byedpi/main.c; the -Dmain=ciadpi_main rename may not apply"
          fi

          echo "Uses of memfd_create (may need API 30+ or a syscall fallback):"
          grep -rn 'memfd_create' "$JNI_DIR/byedpi" --include='*.c' --include='*.h' || echo "none"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK_PATH"
          ls -l "$APK_PATH"
          LISTING="$(unzip -l "$APK_PATH")"

          # 1. Native libraries must be present for every ABI.
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libbyedpi.so libhev-socks5-tunnel.so; do
              if ! grep -q "lib/${abi}/${lib}" <<< "$LISTING"; then
                echo "::error::Missing lib/${abi}/${lib} in the APK"
                exit 1
              fi
            done
          done

          # 2. JNI names in the native code must match the Kotlin classes.
          unzip -p "$APK_PATH" lib/arm64-v8a/libbyedpi.so > /tmp/libbyedpi.so
          unzip -p "$APK_PATH" lib/arm64-v8a/libhev-socks5-tunnel.so > /tmp/libhev.so

          if ! grep -aq 'Java_com_byedpi_app_core_ByeDpiNative_nativeStart' /tmp/libbyedpi.so; then
            echo "::error::libbyedpi.so does not export the ByeDpiNative JNI functions"
            exit 1
          fi
          if ! grep -aq 'ciadpi_main' /tmp/libbyedpi.so; then
            echo "::error::libbyedpi.so does not contain ciadpi_main (upstream main was not renamed/linked)"
            exit 1
          fi
          if ! grep -aq 'com/byedpi/app/core/TProxyService' /tmp/libhev.so; then
            echo "::error::libhev-socks5-tunnel.so does not reference com/byedpi/app/core/TProxyService (check APP_CFLAGS in Application.mk)"
            grep -aoE '[A-Za-z0-9_/]*TProxyService' /tmp/libhev.so | sort -u || true
            exit 1
          fi
          echo "Native engine, JNI names and tunnel class verified."

          {
            echo "### Debug APK"
            echo "- size: $(stat -c %s "$APK_PATH") bytes"
            echo "- sha256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ByeDPI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summarize failure
        if: failure()
        shell: bash
        run: |
          {
            echo "### Build failed"
            echo
            if [ -f build.log ]; then
              echo "#### Error lines (first 40)"
              echo '```'
              grep -nE "error:|FAILED|What went wrong|Execution failed|No such file|undefined reference|fatal" build.log | head -n 40 || true
              echo '```'
              echo "#### Last 60 lines of the Gradle log"
              echo '```'
              tail -n 60 build.log
              echo '```'
            else
              echo "No Gradle log was produced. See the failing step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f build.log ]; then
            grep -E "error:" build.log | head -n 10 | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
          fi

      - name: Collect diagnostics (on failure)
        if: failure()
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "== uname =="; uname -a
            echo "== java =="; java -version 2>&1
            echo "== gradle =="; gradle --version 2>&1 || true
            echo "== ANDROID_HOME =="; echo "${ANDROID_HOME:-unset}"
            echo "== installed NDKs =="; ls "${ANDROID_HOME:-/nonexistent}/ndk" 2>&1 || true
            echo "== upstream versions =="; cat app/src/main/assets/upstream-versions.txt 2>&1 || true
          } > diagnostics/environment.txt 2>&1 || true
          find app/src/main/jni -maxdepth 2 2>/dev/null | sort | head -n 200 > diagnostics/jni-tree.txt || true
          find app/src/main -maxdepth 5 -type f -not -path 'app/src/main/jni/*' 2>/dev/null | sort > diagnostics/project-files.txt || true
          find app/.cxx -maxdepth 5 2>/dev/null | head -n 200 > diagnostics/cxx-tree.txt || true
          cp build.log diagnostics/build.log 2>/dev/null || true

      - name: Upload diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            diagnostics/
            app/build/reports/
            app/build/outputs/logs/
            app/.cxx/**/*.log
            app/.cxx/**/*.txt
            app/.cxx/**/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
